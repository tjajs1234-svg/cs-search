<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<script>/* 다른 페이지 안(프레임)에서는 열리지 않게 */ if (window.top !== window.self) { document.documentElement.innerHTML = ""; throw new Error("frame"); }</script>
<meta name="theme-color" content="#2c52c0">
<title>상담 스크립트 검색기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="tabs" role="tablist" aria-label="화면">
      <button class="tab" role="tab" data-v="scripts" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12H5z"/><path d="M14 4v5h5M8.5 13h7M8.5 16.5h5"/></svg><span class="t">스크립트</span></button>
      <button class="tab" role="tab" data-v="req" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5M8 10.5h5"/></svg><span class="t">문의 검색</span></button>
      <button class="tab" role="tab" data-v="defect" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 19h18L12 3Z"/><path d="M12 10v4M12 17h.01"/></svg><span class="t">불량가이드</span><span class="badge" id="defBadge" hidden></span></button>
      <button class="tab" role="tab" data-v="notice" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4l11 5V5L4 10Z"/><path d="M15 9h1.5a3 3 0 0 1 0 6H15M7 15l1.4 4.5"/></svg><span class="t">공지</span><span class="badge" id="noticeBadge" hidden></span></button>
    </div>
    <span class="sp"></span>
    <button class="iconbtn" id="calcBtn" aria-haspopup="dialog" aria-expanded="false" title="수령일 · AS 감가 계산기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg><span class="t">계산기</span></button>
    <button class="iconbtn" id="themeBtn" title="밝게 · 어둡게"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><span class="t">화면</span></button>
    <button class="iconbtn" id="setBtn" aria-haspopup="dialog" title="설정 · 연결 · 백업"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span class="t">설정</span></button>
  </header>
  <div class="banner" id="banner" hidden></div>

  <div class="views">
    <section class="view" id="v-scripts">
      <nav class="side" aria-label="분류"><div class="list" id="catList"></div></nav>
      <div class="main">
        <div class="searchrow">
          <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="고객 문의를 그대로 붙여 넣거나, 짧게 검색 · 초성도 돼요(ㄱㅎㅈㅅ)" aria-label="문안 검색">
            <button class="x" id="qx" type="button" title="지우기" aria-label="검색어 지우기" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
          <div class="scope" id="scope"></div>
        </div>
        <div class="results" id="results"></div>
      </div>
      <aside class="composer" aria-label="작성공간">
        <div class="hd"><b>작성공간</b><span id="cc">0자</span></div>
        <textarea id="note" spellcheck="false" placeholder="왼쪽 문안의 [담기]를 누르거나 직접 써 주세요.&#10;&#10;초성 단축어: ㅇㅅ + 스페이스 → 첫인사" aria-label="작성공간"></textarea>
        <div class="snip" id="snip" hidden></div>
        <div class="blank" id="blank"></div>
        <div class="cbtns">
          <button class="btn primary big" id="copyBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>복사</button>
          <button class="btn big" id="clearBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>비우기</button>
        </div>
      </aside>
    </section>

    <section class="view" id="v-req" hidden>
      <div class="wide">
        <div class="searchrow">
          <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            <input id="rq" type="search" autocomplete="off" spellcheck="false" placeholder="제품코드(ACS01234) · 제품명 · 증상으로 찾기" aria-label="문의 검색">
            <button class="x" type="button" title="지우기" aria-label="검색어 지우기" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
          <select class="sel" id="ry" aria-label="연도"></select>
          <div class="filters" id="rt"></div>
        </div>
        <div class="results"><div class="scope" id="rinfo" style="margin-bottom:10px"></div><div class="stack" id="rlist"></div></div>
      </div>
    </section>

    <section class="view" id="v-defect" hidden>
      <div class="wide">
        <div class="searchrow">
          <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            <input id="dq" type="search" autocomplete="off" spellcheck="false" placeholder="제품코드 · 제품명 · 불량 증상으로 찾기" aria-label="불량 검색">
            <button class="x" type="button" title="지우기" aria-label="검색어 지우기" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
          <div class="filters" id="dt"></div>
        </div>
        <div class="results"><div class="scope" id="dinfo" style="margin-bottom:10px"></div><div class="stack" id="dlist"></div></div>
      </div>
    </section>

    <section class="view" id="v-notice" hidden>
      <div class="wide"><div class="results" style="padding-top:18px"><div class="scope" id="ninfo" style="margin-bottom:10px"></div><div class="stack" id="nlist"></div></div></div>
    </section>
  </div>
</div>

<div class="pop calc" id="calcPop" hidden role="dialog" aria-label="계산기">
  <div class="ctabs" role="tablist"><button type="button" role="tab" id="cDueTab" aria-selected="true">수령일 계산</button><button type="button" role="tab" id="cAsTab" aria-selected="false">AS 감가 계산</button></div>
  <div id="cDue"><label for="dueIn">상품 수령일</label><p class="sub">수령일은 빼고 다음 날을 1일째로 셉니다(7일).</p><input id="dueIn" inputmode="numeric" autocomplete="off" placeholder="예: 20260701 또는 2026-07-01"><div class="out" id="dueOut" aria-live="polite"></div></div>
  <div id="cAs" hidden><label for="asIn">제품 권장가</label><p class="sub">권장가 기준 · 왕복 배송비 6,000원을 더해 보여 줘요.</p><input id="asIn" inputmode="numeric" autocomplete="off" placeholder="예: 39,900"><div class="out" id="asOut" aria-live="polite"></div></div>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-label="사진 크게 보기"></div>
<dialog class="dlg" id="dlg"></dialog>
<div class="onboard" id="onboard" hidden></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="js/kb-data.js"></script>
<script src="js/kb-github.js"></script>
<script src="js/store.js"></script>
<script src="js/bridge.js"></script>
<script src="js/content.js"></script>
<script src="js/search.js"></script>
<script src="js/media.js"></script>
<script src="js/app.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});</script>
</body>
</html>
