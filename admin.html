<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<script>/* 다른 페이지 안(프레임)에서는 열리지 않게 */ if (window.top !== window.self) { document.documentElement.innerHTML = ""; throw new Error("frame"); }</script>
<link rel="icon" href="icons/icon-192.png">
<title>멘트 관리</title>
<link rel="stylesheet" href="admin/admin-ui.css">
<style>
/* 멘트 관리(관리자용, 상담 데스크 3.4.17 화면을 옮김). ‘멘트 관리’: 왼쪽 분류 · 가운데 멘트 목록 · 오른쪽 고치는 칸.
   고치는 즉시 이 PC에 임시로 남고(창을 닫아도 그대로), 위쪽 [상담사에게 보내기]를 눌러야 모든 PC에 반영 */
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.top .live{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.chg{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.chg.on{color:var(--warning);background:var(--warning-soft);border:1px solid var(--warning-line);border-radius:999px;padding:3px 11px}
.top .btn{height:34px}
.top .btn.primary{padding:0 16px;font-size:13px}
.banner{flex:none;display:flex;gap:10px;align-items:center;padding:8px 18px;background:var(--accent-soft);color:var(--ink-2);font-size:12.5px;border-bottom:1px solid var(--line)}
.banner b{color:var(--accent)}
.banner .x{margin-left:auto;color:var(--muted);font-size:12px;text-decoration:underline}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(280px,360px) minmax(0,1fr)}
/* 왼쪽: 분류 */
.cats{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--card)}
.colhd{flex:none;padding:12px 14px 6px;font-size:11.5px;font-weight:800;color:var(--faint);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.colhd small{font-weight:600;color:var(--faint)}
.catlist{flex:1;min-height:0;overflow-y:auto;padding:0 8px 6px}
.cat{display:flex;align-items:center;gap:4px;height:34px;padding:0 6px 0 2px;border-radius:9px;cursor:pointer;position:relative;border:1px solid transparent}
.cat:hover{background:var(--raised)}
.cat[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cat .grip,.row .grip{flex:none;width:16px;height:22px;display:grid;place-items:center;color:var(--line-2);cursor:grab;font-size:12px;letter-spacing:-2px}
.cat:hover .grip,.row:hover .grip{color:var(--faint)}
.cat .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .n{flex:none;font-size:11.5px;color:var(--faint);font-weight:600;min-width:18px;text-align:right}
.cat .tools{display:none;gap:1px;flex:none}
.cat:hover .tools,.cat[aria-current="true"] .tools,.cat:focus-within .tools{display:flex}
.cat:hover .n,.cat[aria-current="true"] .n{display:none}
.cat.all .n,.cat.all:hover .n{display:block}
.tb{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.tb:hover{background:var(--card);color:var(--ink)}
.tb svg{width:14px;height:14px}
.cat.mod::after{content:"";position:absolute;right:4px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--warning)}
.cat.drop{border-color:var(--accent);background:var(--accent-soft)}
.cat.over-top{box-shadow:0 -2px 0 var(--accent)}.cat.over-bot{box-shadow:0 2px 0 var(--accent)}
.cat input{flex:1;min-width:0;height:26px;border:1px solid var(--accent);border-radius:7px;padding:0 7px;background:var(--card);color:var(--ink);font-weight:600}
.addrow{flex:none;margin:2px 8px 8px;height:32px;border:1px dashed var(--line-2);border-radius:9px;color:var(--muted);font-weight:600;font-size:12.5px}
.addrow:hover{border-style:solid;background:var(--raised);color:var(--ink)}
.navs{flex:none;border-top:1px solid var(--line);padding:8px}
.navx{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border-radius:9px;color:var(--ink-2);font-weight:600;font-size:12.5px;text-align:left;position:relative}
.navx:hover{background:var(--raised)}
.navx[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.navx svg{width:15px;height:15px;flex:none;color:var(--muted)}
.navx .n{margin-left:auto;font-size:11.5px;color:var(--faint)}
.navg{padding:8px 10px 2px;font-size:10.5px;font-weight:800;color:var(--faint);letter-spacing:.02em}.navg:first-child{padding-top:2px}
.navx.mod::after{content:"";position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--warning)}
/* 가운데: 멘트 목록 */
.mid{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.midhd{flex:none;display:flex;gap:8px;padding:12px 12px 8px}
.midhd input{flex:1;min-width:0;height:34px;border:1px solid var(--line-2);border-radius:9px;padding:0 11px;background:var(--card);color:var(--ink)}
.midhd input:focus{outline:2px solid var(--accent);outline-offset:0}
.midinfo{flex:none;padding:0 14px 6px;font-size:11.5px;color:var(--faint);display:flex;gap:8px}
.rows{flex:1;min-height:0;overflow-y:auto;padding:0 8px 12px}
.rowsep{font-size:11.5px;font-weight:800;color:var(--faint);padding:10px 8px 4px}
.row{display:flex;align-items:flex-start;gap:4px;padding:8px 8px 8px 2px;border-radius:10px;cursor:pointer;border:1px solid transparent;position:relative}
.row:hover{background:var(--card)}
.row[aria-current="true"]{background:var(--card);border-color:var(--accent);box-shadow:var(--shadow-1)}
.row .grip{margin-top:1px}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;min-width:0}
.row .t b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .t b.none{color:var(--faint);font-weight:600}
.row .s{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.over-top{box-shadow:0 -2px 0 var(--accent)}.row.over-bot{box-shadow:0 2px 0 var(--accent)}
.row.dragging,.cat.dragging{opacity:.45}
.chip{flex:none;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px;letter-spacing:0}
.chip.new{background:var(--success-soft);color:var(--success)}
.chip.chg{background:var(--warning-soft);color:var(--warning)}
.chip.err{background:var(--danger-soft);color:var(--danger)}
.chip.cat{background:var(--raised);color:var(--muted);font-weight:600}
.empty{padding:28px 16px;color:var(--muted);text-align:center;font-size:12.5px;line-height:1.7;white-space:pre-line}
mark{background:var(--warning-soft);color:inherit;border-radius:3px;padding:0 1px}
/* 오른쪽: 고치는 칸 */
.edit{min-height:0;overflow-y:auto;padding:16px 22px 28px;background:var(--paper)}
.edit .hello{max-width:520px;margin:9vh auto 0;color:var(--muted);line-height:1.8;font-size:13px}
.edit .hello h2{margin:0 0 8px;font-size:15px;color:var(--ink)}
.edit .hello li{margin:2px 0}
.form{max-width:760px;display:flex;flex-direction:column;gap:12px}
.fhead{display:flex;align-items:center;gap:8px;min-height:26px}
.fhead .where{color:var(--muted);font-size:12px}
.fhead .sp{flex:1}
.lab{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:800;color:var(--ink-2);margin-bottom:5px}
.lab small{font-weight:500;color:var(--faint)}
.lab .cnt{margin-left:auto;font-weight:600;color:var(--faint)}
.in,.ta,.sel{width:100%;border:1px solid var(--line-2);border-radius:10px;background:var(--card);color:var(--ink);font:13.5px/1.6 var(--font);padding:9px 12px}
.in.title{font-size:15px;font-weight:700;height:44px;padding:0 12px}
.sel{height:44px;padding:0 10px;font-size:13.5px}
.ta{resize:vertical;min-height:220px;display:block}
.in:focus,.ta:focus,.sel:focus{outline:2px solid var(--accent);outline-offset:0}
.ta.bad,.in.bad{border-color:var(--danger);background:var(--danger-soft)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ins{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px;font-size:11.5px;color:var(--faint)}
.ins button{height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.ins button:hover{background:var(--raised)}
details.more{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px}
details.more summary{cursor:pointer;height:36px;display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--muted);list-style:none}
details.more summary::before{content:"▸";margin-right:6px;font-size:10px}
details.more[open] summary::before{content:"▾"}
details.more .inner{padding:2px 0 12px;display:flex;flex-direction:column;gap:10px}
.pv{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.pv .ph{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:11.5px;font-weight:800;color:var(--faint);border-bottom:1px solid var(--line);background:var(--raised)}
.pv .pb{padding:12px 14px;white-space:pre-wrap;font-size:13px;line-height:1.65;max-height:300px;overflow-y:auto}
.pv .pb:empty::before{content:"멘트 내용을 적으면 여기에 보여요";color:var(--faint)}
.pv .auto{background:var(--accent-soft);border-radius:4px}
.facts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:4px}
.upd{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:12px 14px;border:1px solid var(--warning-line);background:var(--warning-soft);border-radius:10px}.upd b{color:var(--warning)}.upd p{margin:0;font-size:13px;line-height:1.55}
.facts .sp{flex:1}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.danger-ghost{background:var(--card);border:1px solid var(--line-2);color:var(--danger)}
.btn.danger-ghost:hover{background:var(--danger-soft);border-color:var(--danger-line)}
.btn.danger{background:var(--danger);color:#fff}
/* 넓은 화면(끝인사 · 공통 문구 · 이전 판) */
.wide{grid-column:2 / 4;}
.wide{min-height:0;overflow-y:auto;padding:18px 26px 30px}
.wide h2{margin:0 0 4px;font-size:16px}
.wide .desc{color:var(--muted);font-size:12.5px;line-height:1.7;margin:0 0 14px;max-width:760px}
.panel{max-width:820px;display:flex;flex-direction:column;gap:10px}
.clrow{display:grid;grid-template-columns:200px minmax(0,1fr) 34px;gap:8px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.clrow .ta{min-height:76px}
.hrow{display:grid;grid-template-columns:58px 128px 84px 76px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px}
.hrow .v{font-weight:800}
.hrow .note{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .now{font-size:11px;font-weight:800;color:var(--success);background:var(--success-soft);border-radius:999px;padding:2px 9px}
.hrow.cur{border-color:var(--success)}
.muted{color:var(--muted)}
/* 대화 창 · 알림 */
dialog.dlg{border:0;border-radius:14px;padding:18px 20px;min-width:360px;max-width:560px;background:var(--card);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog.dlg::backdrop{background:rgba(15,20,30,.35)}
dialog.dlg h3{margin:0 0 8px;font-size:15px}
dialog.dlg p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.6}
dialog.dlg .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}
dialog.dlg .in{margin-top:4px}
.chlist{list-style:none;margin:0 0 4px;padding:0;max-height:44vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.chlist li{display:flex;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-size:12.5px}
.chlist li:first-child{border-top:0}
.chlist .tg{flex:none;width:62px;font-size:11px;font-weight:800;color:var(--muted)}
.chlist .tg.added{color:var(--success)}.chlist .tg.removed{color:var(--danger)}.chlist .tg.changed{color:var(--warning)}
.chlist .tt{flex:1;min-width:0}
.chlist .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chlist .tt small{color:var(--faint)}
.chlist button{flex:none;font-size:11.5px;color:var(--accent);text-decoration:underline}
.chlist li.err .tg{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--card);border-radius:11px;padding:9px 14px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-2);z-index:50;max-width:80vw}
.toast.err{background:var(--danger);color:#fff}
.toast.ok{background:var(--success);color:#fff}
.toast button{color:inherit;text-decoration:underline;font-weight:800}
@media (max-width:1020px){.cols{grid-template-columns:200px minmax(240px,300px) minmax(0,1fr)}.two{grid-template-columns:minmax(0,1fr)}}
/* 비슷한 멘트 · 끝나는 날 · 공통 문구 · 찾아 바꾸기 */
.sim{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--warning-soft);border:1px solid var(--warning-line)}
.sim .sl{font-size:11.5px;font-weight:700;color:var(--warning);margin-right:2px}
.sim .sb{display:inline-flex;gap:6px;align-items:baseline;height:26px;padding:0 9px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);font-size:11.5px;max-width:100%}
.sim .sb b{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sim .sb span{color:var(--faint)}
.sim .sb:hover{border-color:var(--accent)}
.urow{display:flex;gap:8px;align-items:center}
.pv .auto.bad{background:var(--danger-soft);color:var(--danger)}
.exbtn{font-size:11.5px;font-weight:700;color:var(--danger);background:var(--danger-soft);border-radius:999px;padding:1px 9px}
.exbtn.on{color:var(--accent);background:var(--accent-soft)}
.exbtn.use{color:var(--warning);background:var(--warning-soft)}
.midinfo .sp{flex:1}
.phrow{display:grid;grid-template-columns:220px minmax(0,1fr) 34px;gap:8px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.phrow .ta{min-height:76px}
.phl{display:flex;flex-direction:column;gap:6px;min-width:0}
.phinfo{font-size:11.5px;color:var(--faint)}
.frres{margin-top:10px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.frsum{font-weight:700;margin-bottom:6px}
.frl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.frl li{display:flex;gap:8px;align-items:baseline;font-size:12px}
.frl li span{color:var(--faint);font-size:11.5px}
@media (max-width:760px){.phrow{grid-template-columns:minmax(0,1fr) 34px}.phrow .ta{grid-column:1/-1}}
/* 요청·건의 · 팀 현황 · 사용 통계 */
.ins button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bpost{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.bph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bph .sel{height:28px;width:auto}
.bph .muted,.bcm .muted{color:var(--faint);font-size:11.5px}
.bbody-t{margin:0;white-space:pre-wrap;font-size:13px;line-height:1.65}
.bcm{margin-left:10px;padding:5px 9px;border-left:3px solid var(--line-2);display:flex;flex-wrap:wrap;gap:3px 8px;align-items:baseline;font-size:12.5px}
.bcm.admin{border-left-color:var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.bcm p{margin:0;flex-basis:100%;white-space:pre-wrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-width:980px;margin-bottom:18px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--success)}
.tcard.warm{border-top-color:var(--warning)}
.tcard.hot{border-top-color:var(--danger);background:linear-gradient(var(--danger-soft),var(--card) 70%)}
.tcard.off{border-top-color:var(--line-2);opacity:.75}
.tcard .th{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tcard .th b{font-size:14px}
.tcard .th .muted{font-size:11px;color:var(--faint)}
.tcard .tbig{display:flex;align-items:baseline;gap:4px}
.tcard .tbig .n{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tcard .tbig .u{color:var(--muted);font-size:12px}
.tcard .told{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.tcard.hot .told{color:var(--danger)}
.tcard .tmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);margin-top:4px}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.ttable{border-collapse:collapse;width:100%;font-size:12.5px;min-width:560px}
.ttable th,.ttable td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ttable th:first-child,.ttable td:first-child{text-align:left;font-weight:700}
.ttable th{font-size:11.5px;color:var(--faint);background:var(--raised)}
.ttable tr:last-child td{border-bottom:0}
.tcount td.tc b{display:block;font-size:13.5px;line-height:1.2}
.tcount td.tc small{display:block;font-size:10.5px;color:var(--faint);font-weight:500}
.tcount td.tc .z{color:var(--faint)}
.tcount th.now{color:var(--accent)}
.tcount th.sum,.tcount td.sum{background:var(--raised)}
.tcount tr.total td{border-top:2px solid var(--line-2);font-weight:700}
.ins button:disabled{opacity:.4;cursor:default}
.ttable td.bad{color:var(--danger);font-weight:800}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.6}
.steps a{color:var(--accent);font-weight:700}
.chip.use{background:var(--raised);color:var(--muted);font-weight:600}
.chip.unused{background:var(--warning-soft);color:var(--warning);font-weight:700}
.tcard .tmeta .tlink{color:var(--danger);font-weight:700;text-decoration:none}
.qh{margin:6px 0 0;font-size:14.5px}
.qnav{margin:0 0 12px}
.qnav b{font-size:13px;color:var(--ink)}
.qbox{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.qbox .qn{font-size:13px}
.qlist{display:flex;flex-direction:column;gap:2px}
.qrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;padding:4px 0}
.qrow .sp{flex:1}
.qrow .qw{color:var(--danger)}
.qrow.ot{border-bottom:1px solid var(--line);padding:8px 0}
.qlink{color:var(--accent);font-weight:700;text-decoration:none}
.qlink.off{color:var(--faint);pointer-events:none}
.chb{font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px}
.chb.kakao{background:#FEE500;color:#3A1D1D}
.chb.naver{background:#03C75A;color:#fff}
.chb.board{background:var(--raised);color:var(--ink-2);border:1px solid var(--line)}
.qgaps{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.ttable td.z{color:var(--faint)}
.ttable td.sum{background:var(--raised);font-weight:700}
.ttable td.warnc{color:var(--warning);font-weight:700}
.ttable tr.total td{border-top:2px solid var(--line-2);font-weight:700}
.tflow td.hc{text-align:center;padding:4px}
.tflow .hb{display:inline-block;min-width:28px;padding:3px 0;border-radius:6px;background:color-mix(in srgb,var(--accent) calc(var(--a,0)*55%),transparent);font-weight:700}
.tflow td.hc.z .hb{background:none;color:var(--faint);font-weight:400}
.tread td,.tread th{text-align:left}
.qsw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.qhol{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.qhol .lk,.chip .lk{border:0;background:none;color:var(--faint);cursor:pointer;padding:0 0 0 2px}
.qroster{display:flex;flex-direction:column;gap:4px}
.qdet summary{cursor:pointer;font-size:12.5px;color:var(--muted);margin-top:6px}
.wcal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.wcal .wd{font-size:11.5px;color:var(--faint);text-align:center}
.wcal .wc{min-height:74px;border:1px solid var(--line);border-radius:9px;padding:4px 6px;display:flex;flex-direction:column;gap:2px;background:var(--card);font-size:11.5px;overflow:hidden}
.wcal .wc.blank{border:0;background:none}
.wcal .wc .n{font-weight:700;color:var(--ink-2)}
.wcal .wc.off .n,.wcal .wc .h{color:var(--danger)}
.wcal .wc.sat .n{color:var(--accent)}
.wcal .wc.today{border-color:var(--accent)}
.wcal .ot{font-size:11px;border-radius:5px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcal .ot.ok{background:var(--success-soft);color:var(--success)}
.wcal .ot.wait{background:var(--warning-soft);color:var(--warning)}
.wcal .ot.no{background:var(--raised);color:var(--faint);text-decoration:line-through}
/* 상담사별 보기(팀 현황 · 업무 흐름 · 확인할 상담) */
.panel.wide{max-width:1100px}
.pbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;width:max-content;max-width:100%}
.pchip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 8px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-2);background:none;transition:background .12s}
.pchip:first-child{padding-left:13px}
.pchip:hover{background:var(--raised)}
.pchip.on{background:var(--accent);color:var(--on-accent)}
.pchip.on .av{background:rgba(255,255,255,.22);color:var(--on-accent)}
.pchip .pc{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:800;flex:none}
.av.big{width:44px;height:44px;font-size:19px}
.plink{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:0;font:inherit;font-weight:800;color:var(--ink);cursor:pointer}
.plink:hover{color:var(--accent)}
.tcard.go{cursor:pointer;transition:transform .12s,box-shadow .12s}
.tcard.go:hover{transform:translateY(-1px);box-shadow:var(--shadow-1)}
.phead{max-width:1100px;display:flex;align-items:center;gap:18px;padding:16px 18px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--success);border-radius:14px}
.phead.hot{border-left-color:var(--danger);background:linear-gradient(90deg,var(--danger-soft),var(--card) 45%)}
.phead.off{border-left-color:var(--line-2)}
.pwho{display:flex;align-items:center;gap:10px;font-size:20px}
.pnow{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.pnow .big{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.phead.hot .pnow span:nth-child(2){color:var(--danger);font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tiles.col{grid-template-columns:1fr;align-content:start}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.tile .tl{font-size:11.5px;color:var(--muted);font-weight:600}
.tile .tv{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .ts{font-size:11px;color:var(--faint)}
.tile.bad .tv{color:var(--danger)}
.tile.warn .tv{color:var(--warning)}
.tile.small .tv{font-size:17px;padding-top:4px}
.tile.go{cursor:pointer}
.tile.go:hover{border-color:var(--accent);box-shadow:var(--shadow-1)}
.tile.go:hover .ts{color:var(--accent)}
.wrow2{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:12px;align-items:stretch}
.wbars{display:flex;gap:10px;align-items:stretch;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:190px}
.wbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.wbar .bv{font-size:13px;font-variant-numeric:tabular-nums}
.wbar .bb{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--line-2)}
.wbar .ba,.wbar .br{width:34%;max-width:22px;border-radius:5px 5px 0 0;min-height:2px}
.wbar .ba{background:var(--accent)}
.wbar .br{background:var(--accent-soft)}
.wbar .bl{font-size:11.5px;color:var(--muted)}
.wbar.now .bl{color:var(--accent);font-weight:800}
.wbar.fut{opacity:.35}
.stripw{position:relative;padding-bottom:18px;margin:4px 0 6px}
.strip{position:relative;height:34px;border-radius:9px;background:var(--sunken,var(--raised));overflow:hidden;border:1px solid var(--line)}
.strip .lunch{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 8px)}
.strip .gap{position:absolute;top:0;bottom:0;background:var(--danger-soft);border-left:2px solid var(--danger);border-right:2px solid var(--danger)}
.strip .tick{position:absolute;top:6px;bottom:6px;width:3px;margin-left:-1px;border-radius:2px;background:var(--accent)}
.stripw .axis{position:absolute;left:0;right:0;bottom:0;height:16px}
.stripw .axis span{position:absolute;transform:translateX(-50%);font-size:10.5px;color:var(--faint)}
.hbars{display:flex;gap:6px;align-items:stretch;height:150px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.hcol b{font-size:12px;height:15px}
.hcol .hbw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line-2)}
.hcol .hbar{width:60%;max-width:28px;background:var(--accent);border-radius:5px 5px 0 0;min-height:0}
.hcol .hl{font-size:11px;color:var(--muted)}
.ttable tr.cur td{background:var(--accent-soft)}
.qnav .nl{font-weight:700;color:var(--ink-2);margin-right:4px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;max-width:1100px;margin-bottom:18px}
.qgrid.one{grid-template-columns:1fr}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.qcard.done{opacity:.7}
.qch{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qch .sp{flex:1}
.qbadge{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
.qbadge.red{background:var(--danger-soft);color:var(--danger)}
.qbadge.amber{background:var(--warning-soft);color:var(--warning)}
.qbadge.ok{background:var(--success-soft);color:var(--success)}
.qsec{border-top:1px solid var(--line);padding-top:6px}
.qst{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:2px}
.qcard .qrow .sp{flex:1}
@media (max-width:900px){.wrow2{grid-template-columns:1fr}}
/* 상담사마다 한 칸(팀 현황 · 업무 흐름) */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;max-width:1400px;margin-bottom:18px}
.pcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--success);border-radius:14px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard.warm{border-top-color:var(--warning)}
.pcard.hot{border-top-color:var(--danger);background:linear-gradient(var(--danger-soft),var(--card) 90px)}
.pcard.off{border-top-color:var(--line-2)}
.pch{display:flex;align-items:center;gap:8px}
.pch .pn{font-size:15px}
.pch .sp,.psub .sp{flex:1}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--success-soft);color:var(--success);white-space:nowrap}
.pill.warm{background:var(--warning-soft);color:var(--warning)}
.pill.hot{background:var(--danger);color:#fff}
.pill.off{background:var(--raised);color:var(--faint)}
.pst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.st{display:flex;flex-direction:column;gap:1px;padding:8px 9px;border-radius:10px;background:var(--raised);min-width:0}
.st b{font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.st span{font-size:11px;color:var(--muted);white-space:nowrap}
.st.bad b{color:var(--danger)}
.st.warn b{color:var(--warning)}
.psub{display:flex;align-items:center;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}
.pnone{padding:18px 0;text-align:center;color:var(--faint);font-size:12.5px}
.vb{display:flex;gap:4px;align-items:stretch;height:96px}
.vb.sm{height:72px}
.vc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.vc .vv{font-size:11.5px;height:14px;line-height:14px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.vc .vw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line-2)}
.vc .vbar{width:70%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0}
.vc .vl{font-size:10.5px;color:var(--faint)}
.vc.now .vl{color:var(--accent);font-weight:800}
.vc.lunch .vw{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--raised) 5px 10px)}
.vc:hover .vbar{filter:brightness(1.15)}
.pfoot{display:flex;flex-wrap:wrap;gap:5px;padding-top:8px;border-top:1px solid var(--line)}
.pfoot .pold{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.pwarn{margin:8px 0 2px;padding:8px 10px;border-radius:10px;background:var(--warning-soft);border:1px solid var(--warning-line);color:var(--ink);font-size:12.5px;line-height:1.55;display:grid;gap:4px}
.ptag{height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:11.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.ptag:hover{border-color:var(--accent);color:var(--accent)}
.ptag.ok{color:var(--faint)}
.ptag.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.ptag.warn{background:var(--warning-soft);border-color:transparent;color:var(--warning)}
.pgap{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px}
.pgap .gt{font-weight:700;color:var(--ink-2);margin-right:2px}
.pgap .gchip{background:var(--warning-soft);color:var(--warning);font-weight:700;border-radius:999px;padding:2px 9px}
.pgap .okc{color:var(--success);font-weight:700}
.qcard .qch .pn{font-size:14px}
</style>
</head>
<body>
<header class="top">
 <h1>멘트 관리</h1><span class="adm">관리자용</span><a class="btn ghost" href="./" style="height:30px;text-decoration:none">← 검색기</a>
 <span class="live" id="live"></span>
 <span class="sp"></span>
 <span class="chg" id="chg">바뀐 곳 없음</span>
 <button class="btn ghost" type="button" id="review" hidden>바뀐 곳 보기</button>
 <button class="btn primary" type="button" id="publish" disabled title="고친 멘트를 모든 상담사 PC로 보내요 · 2분 안에 반영 (Ctrl+S)">상담사에게 보내기</button>
</header>
<div class="banner" id="banner" hidden></div>
<main class="cols">
 <nav class="cats" aria-label="분류">
  <div class="colhd">분류 <small>끌어서 순서 바꾸기</small></div>
  <div class="catlist" id="catList"></div>
  <button class="addrow" type="button" id="addCat">+ 새 분류</button>
  <div class="navs">
   <div class="navg">멘트</div>
   <button class="navx" type="button" data-view="closings"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h12M4 10h12M4 14.5h7"/></svg>끝인사<span class="n" id="nClosings"></span></button>
   <button class="navx" type="button" data-view="guide"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H7M13 4h1.5A1.5 1.5 0 0 1 16 5.5v9a1.5 1.5 0 0 1-1.5 1.5H13M8 10h4"/></svg>공통 문구</button>
   <button class="navx" type="button" data-view="notices"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5v3l8 3.5V5L4 8.5ZM12 7.5h1.5a2.5 2.5 0 0 1 0 5H12M6 12l1 4"/></svg>공지</button>
   <button class="navx" type="button" data-view="calc"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="10" height="13" rx="1.5"/><path d="M7.5 6.5h5M7.5 10h.01M10 10h.01M12.5 10h.01M7.5 13h.01M10 13h.01M12.5 13h.01"/></svg>계산기</button>
   <div class="navg">상담사 목소리</div>
   <button class="navx" type="button" data-view="board"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h12v8H8l-4 3.5v-11.5Z"/><path d="M7.5 8h5M7.5 10.5h3"/></svg>요청·건의</button>
   <button class="navx" type="button" data-view="misses"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5"/><path d="m13 13 3.5 3.5M7 9h4"/></svg>못 찾은 검색어</button>
   <div class="navg">팀</div>
   <button class="navx" type="button" data-view="team"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7.5" r="2.5"/><circle cx="13.5" cy="8.5" r="2"/><path d="M2.5 15.5c.6-2.6 2.3-4 4.5-4s3.9 1.4 4.5 4M12 12.2c1.9-.3 3.6.8 4.2 3.3"/></svg>팀 현황</button>
   <button class="navx" type="button" data-view="cal"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="13" height="12" rx="1.5"/><path d="M3.5 8.5h13M7 3v3M13 3v3"/></svg>근무 달력</button>
   <div class="navg">관리</div>
   <button class="navx" type="button" data-view="history"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 1 0 2-4.5M4 4v3h3M10 7v3.2l2 1.3"/></svg>이전 판 · 되돌리기</button>
   <button class="navx" type="button" data-view="conn"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 11.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2l-.8.8M11.5 8.5a3 3 0 0 0-4.2 0l-2.6 2.6a3 3 0 0 0 4.2 4.2l.8-.8"/></svg>연결 설정</button>
  </div>
 </nav>
 <section class="mid" id="mid" aria-label="멘트 목록">
  <div class="midhd"><input type="search" id="q" placeholder="멘트 찾기 · 제목, 내용, 초성(ㄱㅎㅈㅅ)" aria-label="멘트 찾기" autocomplete="off" spellcheck="false"><button class="btn ghost" type="button" id="findRep" title="모든 멘트 내용에서 글자를 한 번에 바꿔요 (Ctrl+H)">찾아 바꾸기</button><button class="btn primary" type="button" id="addCard" title="지금 보는 분류에 새 멘트를 만들어요 (Ctrl+N)">+ 새 멘트</button></div>
  <div class="midinfo" id="midinfo"></div>
  <div class="rows" id="rows"></div>
 </section>
 <section class="edit" id="edit" aria-label="멘트 고치기"></section>
 <section class="wide" id="wide" hidden></section>
</main>
<div class="toast" id="toast" hidden role="status"></div>
